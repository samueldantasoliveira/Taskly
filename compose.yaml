services:
  api:
    image: localhost/rivulus-api:local
    build:
      context: .
      dockerfile: Rivulus.API/Dockerfile
    ports:
      - "${RIVULUS_API_PORT:-5219}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: localhost;127.0.0.1;[::1]
      Cors__AllowedOrigins__0: http://localhost:5173
      Jwt__Key: Ay3/YsgUxPYBiJ+BXFfC50wEUy7/uBk2swF+0uBgwGA=
      MongoDb__ConnectionString: mongodb://mongodb:27017
      # Kept during the rebrand so existing local data remains available.
      MongoDb__DatabaseName: Taskly
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: docker.io/library/mongo:8
    ports:
      - "${RIVULUS_MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongodb-test:
    image: docker.io/library/mongo:8
    ports:
      - "${RIVULUS_MONGO_TEST_PORT:-27018}:27017"
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  mongodb-data:

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Taskly.Web

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: Taskly.Web/.nvmrc
          cache: npm
          cache-dependency-path: Taskly.Web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Compilar frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.taskly.test

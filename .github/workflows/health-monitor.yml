name: API Health Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  health:
    if: ${{ vars.TASKLY_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check readiness
        env:
          HEALTH_URL: ${{ vars.TASKLY_HEALTH_URL }}
        run: bash scripts/check-health.sh "$HEALTH_URL"
